<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generador de presupuestos</title>
    <meta
      http-equiv="refresh"
      content="0; url=https://admira-presupuestos.admira-1619.chatgpt.site/"
    />
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #ffffff;
        --text: #24313c;
        --muted: #6d7b86;
        --brand: #689f3a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(104, 159, 58, 0.16), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(560px, 100%);
        padding: 32px;
        border: 1px solid rgba(36, 49, 60, 0.08);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 20px 60px rgba(36, 49, 60, 0.08);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--brand);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.08;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
    <script>
      window.location.replace("https://admira-presupuestos.admira-1619.chatgpt.site/");
    </script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Admira</p>
      <h1>Abriendo el generador de presupuestos</h1>
      <p>
        Si no se abre automaticamente, usa el boton de abajo para entrar en la
        version publicada.
      </p>
      <a href="https://admira-presupuestos.admira-1619.chatgpt.site/">
        Ir al generador
      </a>
    </main>
  </body>
</html>
